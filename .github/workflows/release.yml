name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string
      next_version:
        description: 'Next development version (e.g., 1.0.1)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Set release version
        run: |
          sed -i "s/pluginVersion = .*/pluginVersion = ${{ inputs.version }}/" gradle.properties
          cat gradle.properties
      
      - name: Build Plugin
        run: ./gradlew clean buildPlugin
      
      - name: Get plugin file name
        id: plugin_file
        run: |
          PLUGIN_FILE=$(ls build/distributions/*.zip | head -1)
          echo "path=$PLUGIN_FILE" >> $GITHUB_OUTPUT
          echo "name=$(basename $PLUGIN_FILE)" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version }}
          name: Ktlint V2 Plugin v${{ inputs.version }}
          body: |
            ## Ktlint V2 Plugin v${{ inputs.version }}
            
            ### Installation
            1. Download `${{ steps.plugin_file.outputs.name }}`
            2. In IntelliJ IDEA / Android Studio, go to **Settings → Plugins → ⚙️ → Install Plugin from Disk...**
            3. Select the downloaded ZIP file
            4. Restart the IDE
            
            ### Features
            - Real-time Kotlin linting as you type
            - Support for custom rule JARs
            - Format with Ktlint action
            - EditorConfig support
          files: ${{ steps.plugin_file.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Bump to next development version
        run: |
          sed -i "s/pluginVersion = .*/pluginVersion = ${{ inputs.next_version }}/" gradle.properties
          cat gradle.properties
      
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump version to ${{ inputs.next_version }} [skip ci]"
          git push
